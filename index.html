                const ticketsData = {
            doop: [
                { ticketNumber: 1, questions: ["Расскажите о творчестве М.И. Глинки. Назовите его основные произведения.", "Охарактеризуйте оперу «Иван Сусанин»: сюжет, главные герои, основные сцены."], fullAnswer1: "Михаил Иванович Глинка (1804–1857) — основоположник русской классической музыки. Он создал первую русскую национальную оперу, заложил основы русского симфонизма и классического романса. Главные произведения: оперы «Иван Сусанин» и «Руслан и Людмила», симфоническая фантазия «Камаринская», романсы «Я помню чудное мгновенье», «Попутная песня», «Жаворонок». Значение Глинки: он соединил европейскую технику с русским народным мелосом.", fullAnswer2: "Опера «Иван Сусанин» («Жизнь за царя») — первая русская национальная опера, написана в 1836 году. Сюжет: 1613 год, поляки идут на Москву. Иван Сусанин заводит поляков в непроходимый лес и погибает, спасая царя. Главные герои: Иван Сусанин (бас), Антонида (сопрано), Ваня (контральто), Собинин (тенор). Основные сцены: интродукция (хор «Родина моя»), ария Сусанина («Чуют правду!»), хор «Славься» в эпилоге. Идейный смысл: патриотизм, верность долгу.", audioFragment: "" },
                { ticketNumber: 2, questions: ["Биография и творчество А.С. Даргомыжского. В чем его новаторство?", "Расскажите об опере «Русалка»: сюжет, музыкальные характеристики героев."], fullAnswer1: "Александр Сергеевич Даргомыжский (1813–1869) — русский композитор, один из основоположников русской классической музыки. Новаторство: правдивое воспроизведение интонаций разговорной речи («Хочу, чтобы звук прямо выражал слово»), введение речитатива, приближенного к мелодии, социальная тематика в песнях («Старый капрал», «Титулярный советник»). Подготовил почву для Мусоргского.", fullAnswer2: "Опера «Русалка» (1856) — первая русская лирико-психологическая опера. Сюжет: Князь бросает дочь мельника Наташу, она бросается в Днепр и становится русалкой. Мельник сходит с ума. Музыкальные характеристики: Мельник (бас) — ария «Ох, тошно мне...» (речитатив, переходящий в безумный смех); Наташа (сопрано) — песня «Мне минуло шестнадцать лет» (светлая, затем драматическая); Князь (тенор) — каватина «Всё тихо...» (эгоистичный, но мучимый совестью).", audioFragment: "" },
                { ticketNumber: 3, questions: ["Творчество А.П. Бородина. Основные жанры и произведения.", "Опера «Князь Игорь»: история создания, сюжет, главные герои. Половецкие пляски."], fullAnswer1: "Александр Порфирьевич Бородин (1833–1887) — русский композитор и учёный-химик, член «Могучей кучки». Сочетал эпический размах с глубокой лирикой. Основные жанры: опера, симфония, романс. Произведения: опера «Князь Игорь», симфония №2 «Богатырская», романсы «Спящая княжна», «Для берегов Отчизны дальней». Особенности стиля: эпичность, русский народный мелос, восточные мотивы.", fullAnswer2: "Опера «Князь Игорь» написана на сюжет «Слова о полку Игореве». После смерти Бородина оперу завершили Римский-Корсаков и Глазунов. Премьера — 1890 год. Сюжет: поход князя Игоря против половцев, пленение, побег. Главные герои: князь Игорь (баритон), Ярославна (сопрано), хан Кончак (бас). Половецкие пляски — хореографическая кульминация оперы, символ восточной страсти и силы. Состоит из хора «Улетай на крыльях ветра», неистового мужского танца и общего танца с хором.", audioFragment: "" },
                { ticketNumber: 4, questions: ["Н.А. Римский-Корсаков — композитор-сказочник. Назовите его оперы на сказочные сюжеты.", "Опера «Снегурочка»: сюжет, музыкальные характеристики главных героев."], fullAnswer1: "Николай Андреевич Римский-Корсаков (1844–1908) — русский композитор, член «Могучей кучки». Его называют «композитором-сказочником». Оперы на сказочные сюжеты: «Снегурочка» (весенняя сказка), «Садко» (былина), «Сказка о царе Салтане», «Кащей Бессмертный», «Золотой петушок». Особенности: реальные и фантастические герои противопоставлены; богатая оркестровка, звукоподражание.", fullAnswer2: "Опера «Снегурочка» (1881) — весенняя сказка по пьесе А.Н. Островского. Сюжет: Снегурочка — дочь Весны и Мороза. Она тает от первого луча солнца, полюбив Мизгиря. Музыкальные характеристики: Снегурочка (сопрано) — ария «С подружками по ягоды ходить» (светлая, прозрачная); Лель (контральто) — третья песня «Туча со громом сговаривалась» (былинная); Мизгирь (тенор) — ариозо «Прости, краса-девица» (страстный); царь Берендей (тенор) — каватина «Полна, полна чудес могучая природа» (величавая).", audioFragment: "" },
                { ticketNumber: 5, questions: ["Творчество М.П. Мусоргского. Опера «Борис Годунов» как народная музыкальная драма.", "Фортепианный цикл «Картинки с выставки»: история создания, содержание."], fullAnswer1: "Модест Петрович Мусоргский (1839–1881) — русский композитор, член «Могучей кучки». «Борис Годунов» — народная музыкальная драма, где народ — главное действующее лицо. Образ народа: в начале покорный, затем бунтующий (хор «Расходилась, разгулялась»). Образ Бориса (бас): сложный трагический образ (монолог «Достиг я высшей власти», сцена с Юродивым).", fullAnswer2: "«Картинки с выставки» (1874) — фортепианный цикл, написанный под впечатлением от выставки художника Виктора Гартмана. 10 пьес-картинок: «Гном», «Старый замок», «Тюильрийский сад», «Быдло», «Балет невылупившихся птенцов», «Два еврея...», «Лиможский рынок», «Катакомбы», «Избушка на курьих ножках» (Баба-Яга), «Богатырские ворота». Позже М. Равель сделал оркестровку цикла.", audioFragment: "" },
                { ticketNumber: 6, questions: ["Жизненный и творческий путь П.И. Чайковского. Основные жанры.", "Опера «Евгений Онегин» как «лирические сцены». Музыкальные характеристики главных героев."], fullAnswer1: "Пётр Ильич Чайковский (1840–1893) — великий русский композитор, дирижёр, педагог. Основные жанры: оперы («Евгений Онегин», «Пиковая дама»), балеты («Лебединое озеро», «Щелкунчик»), симфонии (№1 «Зимние грезы», №4, №5, №6 «Патетическая»), фортепианные циклы («Времена года»), концерты, романсы. Особенности стиля: глубокая эмоциональность, мелодизм, трагическое мироощущение.", fullAnswer2: "Опера «Евгений Онегин» (1878) названа Чайковским «лирическими сценами» — это камерное музыкальное повествование о чувствах простых людей. Главные герои: Татьяна (сопрано) — сцена письма «Пускай погибну я...»; Онегин (баритон) — ариозо «Увы, сомненья нет»; Ленский (тенор) — ария «Куда, куда вы удалились...»; Ольга (контральто); Гремин (бас) — ария «Любви все возрасты покорны». Главные сцены: сцена письма Татьяны, дуэль Ленского и Онегина, финальное объяснение.", audioFragment: "" },
                { ticketNumber: 7, questions: ["Симфоническое творчество П.И. Чайковского. Симфония №1 «Зимние грезы».", "Русский романс первой половины XIX века. Творчество Алябьева, Варламова, Гурилева."], fullAnswer1: "Первая симфония Чайковского (1866) называется «Зимние грезы» (соль-минор). Названия частей: I — «Грезы зимней дорогой» (сонатная форма), II — «Угрюмый край, туманный край» (лирико-психологическая), III — Скерцо, IV — Финал. Главная тема I части начинается у флейт и кларнетов, создаёт образ зимнего пейзажа. Значение: первая русская лирико-жанровая симфония.", fullAnswer2: "В первой половине XIX века расцвёл жанр русского романса. А.А. Алябьев (1787–1851): «Соловей» (написан в тюрьме). А.Е. Варламов (1801–1848): «Красный сарафан», «Белеет парус одинокий» (мелодии простые, близкие к народным). А.Л. Гурилёв (1803–1858): «Колокольчик», «Домик-крошечка» (отличаются задушевностью, грустью). Общие черты: близость к народной песне, связь с поэзией.", audioFragment: "" },
                { ticketNumber: 8, questions: ["Жизнь и творчество С.В. Рахманинова. Основные сочинения.", "Второй концерт для фортепиано с оркестром: образы, строение, главные темы."], fullAnswer1: "Сергей Васильевич Рахманинов (1873–1943) — русский композитор, пианист и дирижёр, последний великий романтик. Ключевые даты: 1873 — рождение; 1901 — Второй концерт; 1917 — отъезд из России; 1943 — смерть в США. Основные сочинения: фортепианные концерты №2 и №3, «Рапсодия на тему Паганини», прелюдия до-диез минор, «Вокализ».", fullAnswer2: "Второй концерт до-минор (1901) посвящён врачу Далю, который вылечил Рахманинова от депрессии. Строение: I часть — Moderato (сонатная форма). Начинается с восьми аккордов фортепиано («колокольность»). Главная партия — суровая, маршевая. Побочная — широкая «бесконечная» мелодия. II часть — Adagio sostenuto (лирическая). III часть — Allegro scherzando (праздничная). Значение: символ преодоления кризиса, от тьмы к свету.", audioFragment: "" },
                { ticketNumber: 9, questions: ["Творчество С.С. Прокофьева. Балет «Ромео и Джульетта».", "Кантата «Александр Невский»: история создания, содержание, основные фрагменты."], fullAnswer1: "Балет «Ромео и Джульетта» (1935) — одно из самых известных произведений Прокофьева. Система лейтмотивов: у каждого героя своя музыкальная тема. «Танец рыцарей» — мощная, тяжеловесная тема с остинатным ритмом, символ вражды двух семейств. Значение: Прокофьев вернул балету драматическую глубину.", fullAnswer2: "Кантата «Александр Невский» (1939) создана на основе музыки к фильму Сергея Эйзенштейна. 7 частей: «Русь под игом монгольским», «Песня об Александре Невском», «Крестоносцы во Пскове», «Вставайте, люди русские», «Ледовое побоище», «Мёртвое поле», «Въезд Александра во Псков». Стала символом патриотической музыки.", audioFragment: "" },
                { ticketNumber: 10, questions: ["Д.Д. Шостакович. Симфония №7 «Ленинградская»: история создания, образное содержание.", "Отечественная музыка второй половины XX века. Творчество Г.В. Свиридова и Р.К. Щедрина."], fullAnswer1: "Седьмая симфония Шостаковича (1941) написана в блокадном Ленинграде. Эпизод нашествия (I часть): 11 вариаций на одну тему. Премьера в Ленинграде — 9 августа 1942 года. Символ борьбы с фашизмом.", fullAnswer2: "Г.В. Свиридов (1915–1998): главный жанр — вокальная и хоровая музыка. «Музыкальные иллюстрации к «Метели» («Романс», «Вальс»). Р.К. Щедрин (р. 1932): балет «Кармен-сюита» (посвящён Майе Плисецкой), концерт для оркестра «Озорные частушки».", audioFragment: "" }
            ],
            fgt: [
                { ticketNumber: 1, questions: ["Русская музыкальная культура XVIII века. Творчество Бортнянского, Березовского, Фомина.", "Оперное творчество М.И. Глинки. Сравнительный анализ опер «Иван Сусанин» и «Руслан и Людмила»."], fullAnswer1: "XVIII век — время становления профессиональной русской музыки. Д.С. Бортнянский (1751–1825) — автор хоровых концертов, самый известный — «Херувимская». М.С. Березовский (1745–1777) — автор концерта «Не отвержи мене во время старости». Е.И. Фомин (1761–1800) — создатель русской оперы («Мельник – колдун, обманщик и сват»). Значение: создана национальная композиторская школа.", fullAnswer2: "«Иван Сусанин» (1836) — героико-трагическая опера. Сюжет исторический. Главный герой — крестьянин. Финал — хор «Славься». «Руслан и Людмила» (1842) — волшебно-эпическая опера. Сюжет сказочный. Сочетает русский и восточный мелос. Различия: трагедия vs сказка, история vs фантастика. Обе оперы — шедевры.", audioFragment: "" },
                { ticketNumber: 2, questions: ["М.И. Глинка — основоположник русской классической музыки. Значение его творчества.", "Симфонические произведения Глинки: «Камаринская», «Арагонская хота», «Вальс-фантазия»."], fullAnswer1: "Глинка — фигура, сравнимая с Пушкиным в литературе. Создал первую русскую национальную оперу, заложил основы русского симфонизма («Камаринская» стала образцом), создал русский классический романс. Цитата: «Музыку создаёт народ, а мы, художники, только её аранжируем».", fullAnswer2: "«Камаринская» (1848) — фантазия на две русские народные темы. Чайковский сказал: «Вся русская симфоническая школа в "Камаринской"». «Арагонская хота» (1845) — написана после поездки в Испанию, использован испанский танец. «Вальс-фантазия» (1839) — первое в русской музыке симфоническое произведение в жанре вальса.", audioFragment: "" },
                { ticketNumber: 3, questions: ["Романсы М.И. Глинки. Жанровое разнообразие. Анализ романса «Я помню чудное мгновенье».", "Творчество А.С. Даргомыжского. Опера «Русалка» как лирико-психологическая драма."], fullAnswer1: "Глинка написал более 70 романсов. Жанровое разнообразие: элегия («Не искушай»), «русская песня» («Жаворонок»), баллада («Ночной смотр»). Романс «Я помню чудное мгновенье» (1840) на стихи Пушкина. Трёхчастная форма. I часть — плавная, II — драматическая, III — светлая реприза.", fullAnswer2: "Опера «Русалка» (1856) — первая русская лирико-психологическая опера. Особенности: главное — внутренний мир героев; речитатив приближен к разговорной речи; сквозное развитие; трагический финал. Мельник (бас) — ария «Ох, тошно мне...» (безумный смех). Подготовила почву для Мусоргского.", audioFragment: "" },
                { ticketNumber: 4, questions: ["«Могучая кучка» — содружество русских композиторов. Состав, идеи, значение.", "Деятельность М.А. Балакирева. Его роль в развитии русской музыки."], fullAnswer1: "«Могучая кучка» — творческое содружество пяти композиторов: Милий Балакирев (глава), Модест Мусоргский, Александр Бородин, Николай Римский-Корсаков, Цезарь Кюи. Идеи: национальная самобытность, реализм. Создана русская национальная школа оперы и симфонизма.", fullAnswer2: "Балакирев — глава «Могучей кучки». Собиратель народных песен (сборник «40 русских народных песен»). Дирижёр и просветитель (руководил Бесплатной музыкальной школой). Композитор — фантазия «Исламей». Без Балакирева не было бы ни Мусоргского, ни Бородина, ни Римского-Корсакова.", audioFragment: "" },
                { ticketNumber: 5, questions: ["Жизненный и творческий путь А.П. Бородина. Основные жанры.", "Опера «Князь Игорь»: драматургия, система лейтмотивов, характеристика главных героев."], fullAnswer1: "Бородин (1833–1887) — композитор и учёный-химик, член «Могучей кучки». Основные жанры: опера, симфония, романс. Особенности стиля: эпическая широта, соединение русского и восточного мелоса.", fullAnswer2: "Опера «Князь Игорь» завершена Римским-Корсаковым и Глазуновым. Драматургия — контраст двух миров: русского (широкая песенная музыка) и половецкого (восточные извилистые мелодии). Главные герои: Игорь (баритон) — ария «Ни сна, ни отдыха»; Ярославна (сопрано) — плач; Кончак (бас); Галицкий (бас). «Половецкие пляски» — кульминация.", audioFragment: "" },
                { ticketNumber: 6, questions: ["Симфоническое творчество А.П. Бородина. «Богатырская» симфония (№2).", "Романсы Бородина: «Спящая княжна», «Для берегов Отчизны дальней»."], fullAnswer1: "Симфония №2 си-минор (1869–1876) — «Богатырская». 4 части: I — Allegro (сонатная форма), главная партия — остинатный ритм, унисон струнных («богатырская поступь»); II — Scherzo; III — Andante; IV — Finale.", fullAnswer2: "«Спящая княжна» (1867) — баллада. Мрачная гармония. «Для берегов Отчизны дальней» (1881) на стихи Пушкина (последние стихи поэта) — элегия-траурный романс, широкая мелодия, фортепиано изображает плеск волн.", audioFragment: "" },
                { ticketNumber: 7, questions: ["Жизнь и творчество М.П. Мусоргского. Новаторство композитора.", "Опера «Борис Годунов» как народная музыкальная драма. Образ народа и образ царя."], fullAnswer1: "Мусоргский (1839–1881) — самый радикальный новатор среди «Могучей кучки». Новаторство: опера строится на речитативе; хор — главное действующее лицо; правда жизни. Цитата: «Жизнь, где бы ни сказалась; правда, как бы ни была солона...»", fullAnswer2: "«Борис Годунов» — народная музыкальная драма. Образ народа: покорный → бунтующий (хор «Расходилась, разгулялась»). Образ Бориса (бас): сложный трагический образ. Монолог «Достиг я высшей власти» — власть далась ценой преступления; сцена с Юродивым — пророчество о смерти.", audioFragment: "" },
                { ticketNumber: 8, questions: ["Вокальное творчество М.П. Мусоргского. Песни и вокальные циклы.", "Фортепианный цикл «Картинки с выставки»: история, содержание, оркестровка Равеля."], fullAnswer1: "Вокальная музыка — самое новаторское в творчестве Мусоргского. Цикл «Детская» — первый в мире вокальный цикл, посвящённый детям. Цикл «Песни и пляски смерти» (1875–1877) — самый мрачный цикл.", fullAnswer2: "«Картинки с выставки» (1874) — фортепианный цикл памяти художника Гартмана. 10 пьес. Оркестровка Равеля (1922): «Прогулка» — труба с валторнами, «Гном» — глиссандо фаготов, «Избушка» — перкуссия, «Богатырские ворота» — весь оркестр.", audioFragment: "" },
                { ticketNumber: 9, questions: ["Жизненный и творческий путь Н.А. Римского-Корсакова. Многогранность деятельности.", "Опера «Снегурочка»: жанр лирической сказки, музыкальные характеристики героев."], fullAnswer1: "Римский-Корсаков (1844–1908) — композитор, педагог (воспитал Стравинского, Прокофьева), теоретик (учебники по гармонии, оркестровке). Создал «петербургскую школу» композиции.", fullAnswer2: "Опера «Снегурочка» (1881) — «весенняя сказка». Снегурочка (сопрано) — светлая ария; Лель (контральто) — третья песня «Туча со громом сговаривалась» (былинная); царь Берендей (тенор) — каватина. Яркие сцены: «Проводы Масленицы», шествие царя Берендея, сцена таяния Снегурочки.", audioFragment: "" },
                { ticketNumber: 10, questions: ["Симфоническое творчество Н.А. Римского-Корсакова. Сюита «Шехеразада».", "Римский-Корсаков — педагог. Его роль в воспитании композиторов."], fullAnswer1: "Сюита «Шехеразада» (1888) на сюжеты «Тысячи и одной ночи». 4 части. Тема Шехеразады (скрипка-соло) проходит через все части — «лейттема рассказчицы».", fullAnswer2: "Римский-Корсаков воспитал более 200 композиторов. Самые известные ученики: Игорь Стравинский, Сергей Прокофьев, Александр Глазунов, Анатолий Лядов. Создал «петербургскую школу» — технически оснащённую, свободную от традиций.", audioFragment: "" },
                { ticketNumber: 11, questions: ["Жизненный и творческий путь П.И. Чайковского. Мировое признание.", "Симфоническое творчество Чайковского. Симфония №1 «Зимние грезы»."], fullAnswer1: "Чайковский — первый русский композитор, которого признали на Западе при жизни. Турне по Европе (1888) и США (1891). Избран членом-корреспондентом Академии изящных искусств во Франции.", fullAnswer2: "Первая симфония «Зимние грезы» (1866) — первая русская лирико-жанровая симфония. I часть — «Грезы зимней дорогой» (сонатная форма). Главная партия — широкая, песенная, с интонациями русской песни. Побочная — светлая, мечтательная.", audioFragment: "" },
                { ticketNumber: 12, questions: ["Опера «Евгений Онегин»: жанр «лирических сцен», драматургия, характеристики героев.", "Образ Татьяны в опере «Евгений Онегин». Сцена письма."], fullAnswer1: "Опера названа «лирическими сценами» — это камерное музыкальное повествование, нет грандиозных хоров. Опера-размышление, опера-исповедь.", fullAnswer2: "Образ Татьяны — центральный в опере. Сцена письма (I картина): речитатив («Пускай погибну я»), ария («Ты в сновиденьях мне являлся»), кульминация («Кто ты, мой ангел ли хранитель»), завершение («Кончаю! Страшно перечесть!»). Чайковский впервые показал женщину как живого человека со сложным внутренним миром.", audioFragment: "" },
                { ticketNumber: 13, questions: ["Русская музыка на рубеже XIX–XX веков. Танеев, Лядов, Глазунов.", "Творчество С.В. Рахманинова. Концерт №2 для фортепиано с оркестром."], fullAnswer1: "С.И. Танеев (1856–1915) — кантата «Иоанн Дамаскин», «русский Бах». А.К. Лядов (1855–1914) — мастер миниатюры («Волшебное озеро», «Кикимора»). А.К. Глазунов (1865–1936) — балет «Раймонда», завершил «Князя Игоря».", fullAnswer2: "Второй концерт — символ преодоления кризиса. I часть: восходящие аккорды фортепиано («колокольность»), суровая главная партия, широкая побочная. II часть — лирическая. III часть — праздничная.", audioFragment: "" },
                { ticketNumber: 14, questions: ["«Русские сезоны» С.П. Дягилева. Творчество И.Ф. Стравинского.", "Балет «Петрушка»: сюжет, музыка, новаторство."], fullAnswer1: "«Русские сезоны» (1907–1914) — антреприза Дягилева в Париже. Балеты Стравинского: «Жар-птица» (1910), «Петрушка» (1911), «Весна священная» (1913).", fullAnswer2: "«Петрушка» — балет в 4 картинах. Сюжет: кукла Петрушка влюблена в Балерину, гибнет от удара Арапа. Новаторство: битональность (тема Петрушки — до-мажор и фа-диез-мажор одновременно), остинато, шарманочные эффекты. Трагический образ «маленького человека».", audioFragment: "" },
                { ticketNumber: 15, questions: ["Отечественная музыкальная культура XX века. Творчество С.С. Прокофьева.", "Балет «Ромео и Джульетта»: система лейтмотивов, образы героев."], fullAnswer1: "Периодизация Прокофьева: ранний (до 1918), зарубежный (1918–1936), советский (1936–1953). Главные произведения советского периода: кантата «Александр Невский», балет «Ромео и Джульетта», симфония №7.", fullAnswer2: "Лейтмотивы: Ромео — мечтательная тема; Джульетта — «Джульетта-девочка» (быстрая, капризная); Тибальт — тема с резкими акцентами; «Танец рыцарей» — остинатный ритм, символ вражды.", audioFragment: "" }
            ]
        };
        // Состояние
        let currentScreen = 'program';
        let currentProgram = null;
        let currentComposer = null;
        let currentTicket = null;
        
        function render() {
            const app = document.getElementById('app');
            if (currentScreen === 'program') renderProgramScreen(app);
            else if (currentScreen === 'main') renderMainMenu(app);
            else if (currentScreen === 'composers') renderComposersList(app);
            else if (currentScreen === 'composerDetail') renderComposerDetail(app);
            else if (currentScreen === 'tickets') renderTicketsList(app);
            else if (currentScreen === 'ticketDetail') renderTicketDetail(app);
        }
        
        function renderProgramScreen(container) {
            container.innerHTML = `
                <div class="header"><h1>🎵 Музлит-репетитор</h1><p class="subtitle">Подготовка к экзамену по русской музыкальной литературе</p></div>
                <div class="card" onclick="selectProgram('FGT')"><div class="icon">🎓</div><h3>ФГТ / ДПОП</h3><p>Предпрофессиональная программа</p></div>
                <div class="card" onclick="selectProgram('DOOP')"><div class="icon">🎨</div><h3>ДООП / ОРП</h3><p>Общеразвивающая программа</p></div>
                <div class="footer"><p>ДШИ «Лицей искусств» им. В.Н. Сафонова, Тольятти</p></div>
            `;
        }
        
        function renderMainMenu(container) {
            const programName = currentProgram === 'FGT' ? 'Предпрофессиональная' : 'Общеразвивающая';
            container.innerHTML = `
                <div class="header"><h1>🎵 Музлит-репетитор</h1><p class="subtitle">${programName} программа</p></div>
                <div class="menu-grid">
                    <div class="menu-card" onclick="goToComposers()"><div class="icon">📚</div><h3>Композиторы</h3><p>29 композиторов с биографиями</p></div>
                    <div class="menu-card" onclick="goToTickets()"><div class="icon">📝</div><h3>Экзаменационные билеты</h3><p>${currentProgram === 'DOOP' ? '10' : '15'} билетов</p></div>
                </div>
                <button class="btn-back" onclick="backToProgram()">← Изменить программу</button>
                <div class="footer"><p>ДШИ «Лицей искусств» им. В.Н. Сафонова, Тольятти</p></div>
            `;
        }
        
        function renderComposersList(container) {
            let html = `<div class="header"><button class="btn-back" onclick="goToMain()">← Назад</button><h1>Композиторы</h1></div>`;
            composersData.forEach(c => {
                html += `<div class="composer-card" onclick="showComposerDetail('${c.id}')"><h3>${c.name}</h3><p class="subtitle">${c.years}</p><p>${c.shortBio.substring(0, 100)}...</p></div>`;
            });
            container.innerHTML = html;
        }
        
        function renderComposerDetail(container) {
            const c = currentComposer;
            container.innerHTML = `
                <div class="header"><button class="btn-back" onclick="goToComposers()">← Назад</button><h1>${c.name}</h1><p class="subtitle">${c.years}</p></div>
                <div style="background: var(--tg-theme-secondary-bg-color, #f5f5f5); border-radius: 16px; padding: 20px;">
                    <div style="margin-bottom: 20px;"><h3>📖 Биография</h3><p>${c.shortBio}</p></div>
                    <div style="margin-bottom: 20px;"><h3>🎵 Главные произведения</h3><p>${c.mainWorks}</p></div>
                    <div><h3>🎓 Что нужно знать на экзамене</h3><p>${c.examNotes}</p></div>
                </div>
            `;
        }
        
        function renderTicketsList(container) {
            const tickets = currentProgram === 'DOOP' ? ticketsData.doop : ticketsData.fgt;
            let html = `<div class="header"><button class="btn-back" onclick="goToMain()">← Назад</button><h1>Экзаменационные билеты</h1></div>`;
            tickets.forEach(t => {
                html += `<div class="ticket-card" onclick="showTicketDetail(${t.ticketNumber})"><h3>Билет №${t.ticketNumber}</h3><p class="subtitle">${t.questions[0].substring(0, 80)}...</p></div>`;
            });
            container.innerHTML = html;
        }
        
        function renderTicketDetail(container) {
            const t = currentTicket;
            container.innerHTML = `
                <div class="header"><button class="btn-back" onclick="goToTickets()">← Назад</button><h1>Билет №${t.ticketNumber}</h1></div>
                <div style="margin-bottom: 16px;"><div style="background: var(--tg-theme-secondary-bg-color, #f5f5f5); border-radius: 12px; padding: 16px;"><h3>Вопрос 1</h3><p>${t.questions[0]}</p><button class="btn-answer" onclick="toggleAnswer(0)">Показать ответ</button><div id="answer-0" class="answer-block hidden">${t.fullAnswer1}</div></div></div>
                <div><div style="background: var(--tg-theme-secondary-bg-color, #f5f5f5); border-radius: 12px; padding: 16px;"><h3>Вопрос 2</h3><p>${t.questions[1]}</p><button class="btn-answer" onclick="toggleAnswer(1)">Показать ответ</button><div id="answer-1" class="answer-block hidden">${t.fullAnswer2}</div></div></div>
            `;
        }
        
        // Навигация
        window.selectProgram = (p) => { currentProgram = p; currentScreen = 'main'; render(); };
        window.backToProgram = () => { currentScreen = 'program'; currentProgram = null; render(); };
        window.goToMain = () => { currentScreen = 'main'; render(); };
        window.goToComposers = () => { currentScreen = 'composers'; render(); };
        window.goToTickets = () => { currentScreen = 'tickets'; render(); };
        window.showComposerDetail = (id) => { currentComposer = composersData.find(c => c.id === id); currentScreen = 'composerDetail'; render(); };
        window.showTicketDetail = (num) => { const tickets = currentProgram === 'DOOP' ? ticketsData.doop : ticketsData.fgt; currentTicket = tickets.find(t => t.ticketNumber === num); currentScreen = 'ticketDetail'; render(); };
        window.toggleAnswer = (idx) => { const div = document.getElementById(`answer-${idx}`); const btn = div.previousElementSibling; if (div.classList.contains('hidden')) { div.classList.remove('hidden'); btn.textContent = 'Скрыть ответ'; } else { div.classList.add('hidden'); btn.textContent = 'Показать ответ'; } };
        
        render();
    </script>
</body>
</html>
