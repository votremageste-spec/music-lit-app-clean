<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музлит-репетитор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            text-align: center;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 16px;
            padding: 20px;
            margin: 16px 0;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #666);
        }
    </style>
</head>
<body>
    <h1>🎵 Музлит-репетитор</h1>
    <p>Подготовка к экзамену по русской музыкальной литературе</p>
    
    <div class="card" onclick="alert('ФГТ / ДПОП выбрана')">
        <div class="icon">🎓</div>
        <h3>ФГТ / ДПОП</h3>
        <p>Предпрофессиональная программа</p>
    </div>
    
    <div class="card" onclick="alert('ДООП / ОРП выбрана')">
        <div class="icon">🎨</div>
        <h3>ДООП / ОРП</h3>
        <p>Общеразвивающая программа</p>
    </div>
    
    <div class="footer">
        ДШИ «Лицей искусств» им. В.Н. Сафонова, Тольятти
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
