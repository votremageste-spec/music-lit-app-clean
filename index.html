<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Музлит-репетитор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 12px;
        }
        h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: var(--tg-theme-hint-color, #666);
            font-size: 14px;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .menu-card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            text-align: center;
        }
        .composer-card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .ticket-card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .btn-back {
            background: none;
            border: 1px solid var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-color, #3390ec);
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            margin-top: 8px;
        }
        .btn-answer {
            background: var(--tg-theme-button-color, #3390ec);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 12px;
        }
        .answer-block {
            background: var(--tg-theme-bg-color, #ffffff);
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            font-size: 14px;
            line-height: 1.5;
            border-left: 4px solid var(--tg-theme-button-color, #3390ec);
        }
        .footer {
            text-align: center;
            margin-top: 32px;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #666);
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="loading">Загрузка...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // ========== 29 КОМПОЗИТОРОВ (ПОЛНЫЙ СПИСОК) ==========
        const composersData = [
            { id: "bortnyansky", name: "Д.С. Бортнянский", years: "1751–1825", shortBio: "Русский композитор украинского происхождения. Был придворным капельмейстером в Петербурге. Создатель русской школы хорового пения.", mainWorks: "«Херувимская песнь», «Да воскреснет Бог», «Сколь славен наш Господь в Сионе»", examNotes: "Хоровой концерт a cappella. Соединил итальянское письмо с русским распевом." },
            { id: "berezovsky", name: "М.С. Березовский", years: "1745–1777", shortBio: "Русский композитор. Трагическая судьба — умер в нищете и отчаянии.", mainWorks: "Хоровой концерт «Не отвержи мене во время старости»", examNotes: "Первый русский композитор, чьё произведение исполняли в Европе." },
            { id: "fomin", name: "Е.И. Фомин", years: "1761–1800", shortBio: "Русский композитор, один из создателей русской оперы.", mainWorks: "«Мельник – колдун, обманщик и сват», «Орфей»", examNotes: "Первая русская комическая опера «Мельник...»" },
            { id: "alyabyev", name: "А.А. Алябьев", years: "1787–1851", shortBio: "Русский композитор, участник Отечественной войны 1812 года. Был сослан в Сибирь.", mainWorks: "«Соловей», «Зимняя дорога»", examNotes: "Романс «Соловей» написан в тюрьме. Мелодия изображает трели соловья." },
            { id: "varlamov", name: "А.Е. Варламов", years: "1801–1848", shortBio: "Русский композитор, дирижёр, певец. Его романсы стали народными песнями.", mainWorks: "«Красный сарафан», «Белеет парус одинокий»", examNotes: "Простые, распевные мелодии, близкие к народной песне." },
            { id: "gurilyov", name: "А.Л. Гурилёв", years: "1803–1858", shortBio: "Русский композитор, пианист. Его отец был крепостным музыкантом.", mainWorks: "«Колокольчик», «Домик-крошечка»", examNotes: "Романсы отличаются задушевностью, грустью." },
            { id: "glinka", name: "М.И. Глинка", years: "1804–1857", shortBio: "Основоположник русской классической музыки. Создал первую русскую национальную оперу.", mainWorks: "Оперы «Иван Сусанин», «Руслан и Людмила»; «Камаринская»; романсы", examNotes: "Создатель русской оперы и симфонизма. «Камаринская» — основа русской симфонической школы." },
            { id: "dargomyzhsky", name: "А.С. Даргомыжский", years: "1813–1869", shortBio: "Русский композитор, новатор в области вокальной музыки. Дружил с Глинкой.", mainWorks: "Опера «Русалка», «Каменный гость»; романсы", examNotes: "Новаторство: правдивое воспроизведение интонаций разговорной речи." },
            { id: "balakirev", name: "М.А. Балакирев", years: "1837–1910", shortBio: "Глава «Могучей кучки». Композитор, пианист, дирижёр.", mainWorks: "«Исламей» (фантазия), симфония №1", examNotes: "Собирал народные песни. Руководил Бесплатной музыкальной школой." },
            { id: "cui", name: "Ц.А. Кюи", years: "1835–1918", shortBio: "Композитор, военный инженер, генерал, музыкальный критик.", mainWorks: "Оперы «Вильям Ратклиф», «Анджело»", examNotes: "Как критик пропагандировал творчество «Могучей кучки»." },
            { id: "borodin", name: "А.П. Бородин", years: "1833–1887", shortBio: "Русский композитор и учёный-химик, член «Могучей кучки».", mainWorks: "Опера «Князь Игорь», симфония №2 «Богатырская»", examNotes: "Эпическая опера «Князь Игорь». «Половецкие пляски»." },
            { id: "musorgsky", name: "М.П. Мусоргский", years: "1839–1881", shortBio: "Русский композитор, член «Могучей кучки». Новатор в области музыкальной драмы.", mainWorks: "Опера «Борис Годунов», «Картинки с выставки»", examNotes: "Опера «Борис Годунов» — народная музыкальная драма." },
            { id: "rimsky_korsakov", name: "Н.А. Римский-Корсаков", years: "1844–1908", shortBio: "Русский композитор, педагог, дирижёр. Мастер оркестровки.", mainWorks: "Оперы «Снегурочка», «Садко»; «Шехеразада»", examNotes: "«Снегурочка» — весенняя сказка. «Шехеразада» — восточный колорит." },
            { id: "tchaikovsky", name: "П.И. Чайковский", years: "1840–1893", shortBio: "Великий русский композитор, дирижёр, педагог.", mainWorks: "Оперы «Евгений Онегин», балеты «Лебединое озеро», симфонии", examNotes: "«Евгений Онегин» — лирические сцены. Симфония №1 «Зимние грезы»." },
            { id: "rachmaninov", name: "С.В. Рахманинов", years: "1873–1943", shortBio: "Русский композитор, пианист-виртуоз, дирижёр. С 1917 года в эмиграции.", mainWorks: "Концерт №2, «Вокализ», прелюдия до-диез минор", examNotes: "Второй концерт. «Вокализ». Эмиграция 1917 года." },
            { id: "prokofiev", name: "С.С. Прокофьев", years: "1891–1953", shortBio: "Русский композитор. В 1936 вернулся в СССР.", mainWorks: "Балет «Ромео и Джульетта», кантата «Александр Невский»", examNotes: "«Ромео и Джульетта» (Танец рыцарей). «Александр Невский»." },
            { id: "shostakovich", name: "Д.Д. Шостакович", years: "1906–1975", shortBio: "Великий советский композитор, автор 15 симфоний.", mainWorks: "Симфония №7 «Ленинградская», «Казнь Степана Разина»", examNotes: "Симфония №7 — тема нашествия. Исполнена в блокадном Ленинграде." },
            { id: "khachaturian", name: "А.И. Хачатурян", years: "1903–1978", shortBio: "Армянский советский композитор.", mainWorks: "«Спартак», «Гаянэ» («Танец с саблями»)", examNotes: "«Танец с саблями» из «Гаянэ»." },
            { id: "sviridov", name: "Г.В. Свиридов", years: "1915–1998", shortBio: "Русский советский композитор. Продолжатель традиций Мусоргского.", mainWorks: "«Метель» (иллюстрации к Пушкину), «Поэма памяти Есенина»", examNotes: "«Метель»: «Романс», «Вальс»." },
            { id: "gavrilin", name: "В.А. Гаврилин", years: "1939–1999", shortBio: "Русский советский композитор. Представитель «новой фольклорной волны».", mainWorks: "«Перезвоны», балет «Анюта»", examNotes: "Вальс из балета «Анюта»." },
            { id: "shchedrin", name: "Р.К. Щедрин", years: "1932–н.в.", shortBio: "Русский советский композитор, пианист. Муж Майи Плисецкой.", mainWorks: "«Кармен-сюита», «Озорные частушки»", examNotes: "«Кармен-сюита» посвящена Плисецкой." },
            { id: "schnittke", name: "А.Г. Шнитке", years: "1934–1998", shortBio: "Русский композитор немецкого происхождения. Лидер авангарда.", mainWorks: "Concerto grosso №1, симфония №1", examNotes: "Понятие «полистилистика». Музыка к кино." },
            { id: "gubaidulina", name: "С.А. Губайдуллина", years: "1931–н.в.", shortBio: "Русский композитор, живёт в Германии. Лидер авангарда.", mainWorks: "«Detto-I», «Живое-неживое»", examNotes: "Духовная музыка, экспериментальная техника." },
            { id: "denisov", name: "Э.В. Денисов", years: "1929–1996", shortBio: "Русский композитор, лидер авангарда.", mainWorks: "«Знаки на белом», «Диана в осеннем ветре»", examNotes: "Представитель авангарда." },
            { id: "taneev", name: "С.И. Танеев", years: "1856–1915", shortBio: "Русский композитор, пианист, педагог. Ученик Чайковского.", mainWorks: "Кантата «Иоанн Дамаскин»", examNotes: "Кантата «Иоанн Дамаскин». Мастер полифонии." },
            { id: "lyadov", name: "А.К. Лядов", years: "1855–1914", shortBio: "Русский композитор, ученик Римского-Корсакова.", mainWorks: "«Волшебное озеро», «Кикимора»", examNotes: "Мастер миниатюры. Сказочные симфонические картины." },
            { id: "glazunov", name: "А.К. Глазунов", years: "1865–1936", shortBio: "Русский композитор, директор Петербургской консерватории.", mainWorks: "Балет «Раймонда», 8 симфоний", examNotes: "Завершил оперу «Князь Игорь» Бородина." },
            { id: "scriabin", name: "А.Н. Скрябин", years: "1872–1915", shortBio: "Русский композитор, пианист-виртуоз, философ-мистик.", mainWorks: "«Поэма экстаза», «Прометей»", examNotes: "Новаторская гармония. Светомузыка." },
            { id: "stravinsky", name: "И.Ф. Стравинский", years: "1882–1971", shortBio: "Русский композитор, эмигрант. Самый влиятельный композитор XX века.", mainWorks: "«Петрушка», «Весна священная»", examNotes: "Битональность, полиритмия. «Петрушка»." }
        ];
        
        // ========== ПОЛНЫЕ БИЛЕТЫ С РАЗВЁРНУТЫМИ ОТВЕТАМИ ==========
        const ticketsData = {
            doop: [
                { ticketNumber: 1, questions: ["Расскажите о творчестве М.И. Глинки. Назовите его основные произведения.", "Охарактеризуйте оперу «Иван Сусанин»: сюжет, главные герои, основные сцены."], fullAnswer1: "Михаил Иванович Глинка (1804–1857) — основоположник русской классической музыки. Он создал первую русскую национальную оперу, заложил основы русского симфонизма и классического романса. Главные произведения: оперы «Иван Сусанин» и «Руслан и Людмила», симфоническая фантазия «Камаринская», романсы «Я помню чудное мгновенье», «Попутная песня», «Жаворонок».", fullAnswer2: "Опера «Иван Сусанин» («Жизнь за царя») — первая русская национальная опера, написана в 1836 году. Сюжет: Иван Сусанин заводит поляков в непроходимый лес и погибает, спасая царя. Главные герои: Иван Сусанин (бас), Антонида (сопрано), Ваня (контральто), Собинин (тенор). Основные сцены: интродукция, ария Сусанина, хор «Славься».", audioFragment: "" }
            ],
            fgt: [
                { ticketNumber: 1, questions: ["Русская музыкальная культура XVIII века. Творчество Бортнянского, Березовского, Фомина.", "Оперное творчество М.И. Глинки. Сравнительный анализ опер «Иван Сусанин» и «Руслан и Людмила»."], fullAnswer1: "XVIII век — время становления профессиональной русской музыки. Д.С. Бортнянский (1751–1825) — автор хоровых концертов, самый известный — «Херувимская». М.С. Березовский (1745–1777) — автор концерта «Не отвержи мене во время старости». Е.И. Фомин (1761–1800) — создатель русской оперы («Мельник – колдун, обманщик и сват»). Значение: создана национальная композиторская школа.", fullAnswer2: "«Иван Сусанин» (1836) — героико-трагическая опера на исторический сюжет. Главный герой — крестьянин. Музыка основана на русских народных песнях. Финал — хор «Славься». «Руслан и Людмила» (1842) — волшебно-эпическая опера на сказочный сюжет по Пушкину. Сочетает русский и восточный мелос. Различия: трагедия vs сказка, история vs фантастика. Обе оперы — шедевры, заложившие основы русской оперной школы.", audioFragment: "" }
            ]
        };
        
        // Состояние
        let currentScreen = 'program';
        let currentProgram = null;
        let currentComposer = null;
        let currentTicket = null;
        
        function render() {
            const app = document.getElementById('app');
            if (currentScreen === 'program') renderProgramScreen(app);
            else if (currentScreen === 'main') renderMainMenu(app);
            else if (currentScreen === 'composers') renderComposersList(app);
            else if (currentScreen === 'composerDetail') renderComposerDetail(app);
            else if (currentScreen === 'tickets') renderTicketsList(app);
            else if (currentScreen === 'ticketDetail') renderTicketDetail(app);
        }
        
        function renderProgramScreen(container) {
            container.innerHTML = `
                <div class="header"><h1>🎵 Музлит-репетитор</h1><p class="subtitle">Подготовка к экзамену по русской музыкальной литературе</p></div>
                <div class="card" onclick="selectProgram('FGT')"><div class="icon">🎓</div><h3>ФГТ / ДПОП</h3><p>Предпрофессиональная программа</p></div>
                <div class="card" onclick="selectProgram('DOOP')"><div class="icon">🎨</div><h3>ДООП / ОРП</h3><p>Общеразвивающая программа</p></div>
                <div class="footer"><p>ДШИ «Лицей искусств» им. В.Н. Сафонова, Тольятти</p></div>
            `;
        }
        
        function renderMainMenu(container) {
            const programName = currentProgram === 'FGT' ? 'Предпрофессиональная' : 'Общеразвивающая';
            container.innerHTML = `
                <div class="header"><h1>🎵 Музлит-репетитор</h1><p class="subtitle">${programName} программа</p></div>
                <div class="menu-grid">
                    <div class="menu-card" onclick="goToComposers()"><div class="icon">📚</div><h3>Композиторы</h3><p>29 композиторов с биографиями</p></div>
                    <div class="menu-card" onclick="goToTickets()"><div class="icon">📝</div><h3>Экзаменационные билеты</h3><p>${currentProgram === 'DOOP' ? '10' : '15'} билетов</p></div>
                </div>
                <button class="btn-back" onclick="backToProgram()">← Изменить программу</button>
                <div class="footer"><p>ДШИ «Лицей искусств» им. В.Н. Сафонова, Тольятти</p></div>
            `;
        }
        
        function renderComposersList(container) {
            let html = `<div class="header"><button class="btn-back" onclick="goToMain()">← Назад</button><h1>Композиторы</h1></div>`;
            composersData.forEach(c => {
                html += `<div class="composer-card" onclick="showComposerDetail('${c.id}')"><h3>${c.name}</h3><p class="subtitle">${c.years}</p><p>${c.shortBio.substring(0, 100)}...</p></div>`;
            });
            container.innerHTML = html;
        }
        
        function renderComposerDetail(container) {
            const c = currentComposer;
            container.innerHTML = `
                <div class="header"><button class="btn-back" onclick="goToComposers()">← Назад</button><h1>${c.name}</h1><p class="subtitle">${c.years}</p></div>
                <div style="background: var(--tg-theme-secondary-bg-color, #f5f5f5); border-radius: 16px; padding: 20px;">
                    <div style="margin-bottom: 20px;"><h3>📖 Биография</h3><p>${c.shortBio}</p></div>
                    <div style="margin-bottom: 20px;"><h3>🎵 Главные произведения</h3><p>${c.mainWorks}</p></div>
                    <div><h3>🎓 Что нужно знать на экзамене</h3><p>${c.examNotes}</p></div>
                </div>
            `;
        }
        
        function renderTicketsList(container) {
            const tickets = currentProgram === 'DOOP' ? ticketsData.doop : ticketsData.fgt;
            let html = `<div class="header"><button class="btn-back" onclick="goToMain()">← Назад</button><h1>Экзаменационные билеты</h1></div>`;
            tickets.forEach(t => {
                html += `<div class="ticket-card" onclick="showTicketDetail(${t.ticketNumber})"><h3>Билет №${t.ticketNumber}</h3><p class="subtitle">${t.questions[0].substring(0, 80)}...</p></div>`;
            });
            container.innerHTML = html;
        }
        
        function renderTicketDetail(container) {
            const t = currentTicket;
            container.innerHTML = `
                <div class="header"><button class="btn-back" onclick="goToTickets()">← Назад</button><h1>Билет №${t.ticketNumber}</h1></div>
                <div style="margin-bottom: 16px;"><div style="background: var(--tg-theme-secondary-bg-color, #f5f5f5); border-radius: 12px; padding: 16px;"><h3>Вопрос 1</h3><p>${t.questions[0]}</p><button class="btn-answer" onclick="toggleAnswer(0)">Показать ответ</button><div id="answer-0" class="answer-block hidden">${t.fullAnswer1}</div></div></div>
                <div><div style="background: var(--tg-theme-secondary-bg-color, #f5f5f5); border-radius: 12px; padding: 16px;"><h3>Вопрос 2</h3><p>${t.questions[1]}</p><button class="btn-answer" onclick="toggleAnswer(1)">Показать ответ</button><div id="answer-1" class="answer-block hidden">${t.fullAnswer2}</div></div></div>
            `;
        }
        
        // Навигация
        window.selectProgram = (p) => { currentProgram = p; currentScreen = 'main'; render(); };
        window.backToProgram = () => { currentScreen = 'program'; currentProgram = null; render(); };
        window.goToMain = () => { currentScreen = 'main'; render(); };
        window.goToComposers = () => { currentScreen = 'composers'; render(); };
        window.goToTickets = () => { currentScreen = 'tickets'; render(); };
        window.showComposerDetail = (id) => { currentComposer = composersData.find(c => c.id === id); currentScreen = 'composerDetail'; render(); };
        window.showTicketDetail = (num) => { const tickets = currentProgram === 'DOOP' ? ticketsData.doop : ticketsData.fgt; currentTicket = tickets.find(t => t.ticketNumber === num); currentScreen = 'ticketDetail'; render(); };
        window.toggleAnswer = (idx) => { const div = document.getElementById(`answer-${idx}`); const btn = div.previousElementSibling; if (div.classList.contains('hidden')) { div.classList.remove('hidden'); btn.textContent = 'Скрыть ответ'; } else { div.classList.add('hidden'); btn.textContent = 'Показать ответ'; } };
        
        render();
    </script>
</body>
</html>
