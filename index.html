<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Музлит-репетитор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 24px; }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: var(--tg-theme-hint-color, #666); font-size: 14px; }
        .card, .menu-card, .composer-card, .ticket-card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover, .menu-card:hover, .composer-card:hover, .ticket-card:hover { transform: translateY(-2px); }
        .icon { font-size: 48px; margin-bottom: 12px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .btn-back {
            background: none;
            border: 1px solid var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-color, #3390ec);
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            margin-top: 8px;
        }
        .btn-answer {
            background: var(--tg-theme-button-color, #3390ec);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 12px;
        }
        .answer-block {
            background: var(--tg-theme-bg-color, #ffffff);
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            font-size: 14px;
            line-height: 1.5;
            border-left: 4px solid var(--tg-theme-button-color, #3390ec);
        }
        .footer { text-align: center; margin-top: 32px; font-size: 12px; color: var(--tg-theme-hint-color, #666); }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container" id="app">Загрузка...</div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const composers = [
            { id: "glinka", name: "М.И. Глинка", years: "1804–1857", shortBio: "Основоположник русской классической музыки.", mainWorks: "«Иван Сусанин», «Руслан и Людмила»", examNotes: "Создатель русской оперы." },
            { id: "tchaikovsky", name: "П.И. Чайковский", years: "1840–1893", shortBio: "Великий русский композитор.", mainWorks: "«Евгений Онегин», «Лебединое озеро»", examNotes: "Лирические сцены." },
            { id: "musorgsky", name: "М.П. Мусоргский", years: "1839–1881", shortBio: "Член «Могучей кучки», новатор.", mainWorks: "«Борис Годунов», «Картинки с выставки»", examNotes: "Народная музыкальная драма." },
            { id: "borodin", name: "А.П. Бородин", years: "1833–1887", shortBio: "Композитор и учёный-химик.", mainWorks: "«Князь Игорь»", examNotes: "«Половецкие пляски»." },
            { id: "rimsky_korsakov", name: "Н.А. Римский-Корсаков", years: "1844–1908", shortBio: "Мастер оркестровки.", mainWorks: "«Снегурочка», «Шехеразада»", examNotes: "Весенняя сказка." }
        ];
        
        let screen = 'program';
        let program = null;
        let selectedComposer = null;
        
        function render() {
            const app = document.getElementById('app');
            if (screen === 'program') {
                app.innerHTML = `
                    <div class="header"><h1>🎵 Музлит-репетитор</h1><p class="subtitle">Подготовка к экзамену</p></div>
                    <div class="card" onclick="select('FGT')"><div class="icon">🎓</div><h3>ФГТ / ДПОП</h3><p>Предпрофессиональная программа</p></div>
                    <div class="card" onclick="select('DOOP')"><div class="icon">🎨</div><h3>ДООП / ОРП</h3><p>Общеразвивающая программа</p></div>
                    <div class="footer"><p>ДШИ «Лицей искусств» им. В.Н. Сафонова</p></div>
                `;
            } else if (screen === 'main') {
                app.innerHTML = `
                    <div class="header"><h1>🎵 Музлит-репетитор</h1><p class="subtitle">${program === 'FGT' ? 'Предпрофессиональная' : 'Общеразвивающая'} программа</p></div>
                    <div class="menu-grid">
                        <div class="menu-card" onclick="goToComposers()"><div class="icon">📚</div><h3>Композиторы</h3><p>5 композиторов</p></div>
                        <div class="menu-card" onclick="alert('Скоро')"><div class="icon">📝</div><h3>Билеты</h3><p>Скоро</p></div>
                    </div>
                    <button class="btn-back" onclick="back()">← Изменить программу</button>
                `;
            } else if (screen === 'composers') {
                let html = `<div class="header"><button class="btn-back" onclick="goToMain()">← Назад</button><h1>Композиторы</h1></div>`;
                composers.forEach(c => {
                    html += `<div class="composer-card" onclick="showComposer('${c.id}')"><h3>${c.name}</h3><p class="subtitle">${c.years}</p><p>${c.shortBio}</p></div>`;
                });
                app.innerHTML = html;
            } else if (screen === 'composerDetail' && selectedComposer) {
                const c = selectedComposer;
                app.innerHTML = `
                    <div class="header"><button class="btn-back" onclick="goToComposers()">← Назад</button><h1>${c.name}</h1><p class="subtitle">${c.years}</p></div>
                    <div style="background: var(--tg-theme-secondary-bg-color, #f5f5f5); border-radius: 16px; padding: 20px;">
                        <div style="margin-bottom: 20px;"><h3>📖 Биография</h3><p>${c.shortBio}</p></div>
                        <div style="margin-bottom: 20px;"><h3>🎵 Главные произведения</h3><p>${c.mainWorks}</p></div>
                        <div><h3>🎓 Что нужно знать на экзамене</h3><p>${c.examNotes}</p></div>
                    </div>
                `;
            }
        }
        
        window.select = (p) => { program = p; screen = 'main'; render(); };
        window.back = () => { screen = 'program'; program = null; render(); };
        window.goToMain = () => { screen = 'main'; render(); };
        window.goToComposers = () => { screen = 'composers'; render(); };
        window.showComposer = (id) => { selectedComposer = composers.find(c => c.id === id); screen = 'composerDetail'; render(); };
        
        render();
    </script>
</body>
</html>
