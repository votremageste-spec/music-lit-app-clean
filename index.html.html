<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Музлит-репетитор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>🎵 Музлит-репетитор</h1>
            <p class="subtitle">Подготовка к экзамену по русской музыкальной литературе</p>
        </div>
        <div class="content">
            <div class="card program-card" data-program="FGT">
                <div class="program-icon">🎓</div>
                <h3>ФГТ / ДПОП</h3>
                <p>Предпрофессиональная программа</p>
            </div>
            <div class="card program-card" data-program="DOOP">
                <div class="program-icon">🎨</div>
                <h3>ДООП / ОРП</h3>
                <p>Общеразвивающая программа</p>
            </div>
        </div>
        <div class="footer">
            <p>ДШИ «Лицей искусств» им. В.Н. Сафонова, Тольятти</p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
